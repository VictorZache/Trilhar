{% extends "base.html" %}

{% block title %}Entrar - Trilhar{% endblock %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 0 auto;">
  <div class="card-body">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, var(--color-brand), var(--color-accent)); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 1.75rem; color: #fff;">T</div>
      <h1 style="font-size: 1.75rem; font-weight: 700; color: var(--color-text); margin-bottom: 0.5rem;">Entrar</h1>
      <p style="color: var(--color-text-muted);">Acesse sua conta para continuar</p>
    </div>

    {% if erro %}
    <div class="alert alert-error">{{ erro }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" class="form-control" required autocomplete="username" placeholder="seu_usuario">
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" class="form-control" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-full">Entrar</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem;">
      <p style="color: var(--color-text-muted); font-size: 0.9rem;">Não tem conta? <a href="/cadastro" style="color: var(--color-brand); font-weight: 600;">Criar conta</a></p>
    </div>
  </div>
</div>
{% endblock %}
