{% extends "base.html" %}

{% block title %}Entrar - Trilhar{% endblock %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 0 auto;">
  <div class="card-body">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div style="width: 48px; height: 48px; border-radius: 12px; background: var(--primary); color: var(--primary-foreground); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 1.35rem; font-weight: 800;">T</div>
      <h1 style="font-size: 1.6rem; font-weight: 700; color: var(--foreground); margin-bottom: 0.35rem;">Entrar</h1>
      <p style="color: var(--muted-foreground); font-size: 0.95rem;">Acesse sua conta para continuar</p>
    </div>

    {% if erro %}
    <div class="alert alert-error">{{ erro }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" class="form-control" required autocomplete="username" placeholder="seu_usuario">
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" class="form-control" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-full">Entrar</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem;">
      <p style="color: var(--color-text-muted); font-size: 0.9rem;">Não tem conta? <a href="/cadastro" style="color: var(--foreground); font-weight: 600; text-decoration: underline;">Criar conta</a></p>
    </div>
  </div>
</div>
{% endblock %}
